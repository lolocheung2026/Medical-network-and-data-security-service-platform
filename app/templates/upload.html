{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin:0 0 8px;font-size:16px">沙盒上传</h2>
  <p class="muted">所有上传经自动脱密引擎处理；检测到原始医疗数据将整体拒绝入库。</p>
  <form method="post" enctype="multipart/form-data" style="margin-top:12px">
    <label class="muted">数据类型</label><br>
    <select name="kind" style="padding:8px;border:1px solid #d3d1c7;border-radius:6px;margin:6px 0 12px">
      <option value="data_dict">数据字典（CSV）</option>
      <option value="topology">拓扑图（JSON）</option>
    </select><br>
    <input type="file" name="file" required>
    <button class="btn" type="submit" style="margin-left:8px">上传并脱密</button>
  </form>
</div>
{% if result %}
<div class="card">
  {% if result.ok %}
    <p style="color:#27500A;margin:0 0 8px">✔ {{ result.msg }}</p>
  {% else %}
    <p class="error" style="margin:0 0 8px">✘ {{ result.msg }}</p>
  {% endif %}
  <pre style="background:#f1efe8;border-radius:6px;padding:12px;font-size:12px;overflow:auto">{{ result.report | tojson(indent=2) }}</pre>
</div>
{% endif %}
{% endblock %}
